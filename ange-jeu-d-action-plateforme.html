<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANGE — L'Élu des Cieux</title>
<style>
  :root { font-family: system-ui, sans-serif; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
  h1 { font-size: 20px; margin: 8px; letter-spacing: 4px; color: #ffd700; text-shadow: 0 0 12px #ffd70088; }
  #game { border: 2px solid #ffd70055; border-radius: 8px; background: linear-gradient(#1a1a3e 0%, #3a2a5e 60%, #5e3a6e 100%); cursor: none; }
  #hud { position: absolute; top: 12px; left: 16px; font-size: 14px; font-weight: bold; text-shadow: 0 0 6px #000; pointer-events: none; }
  #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }
  #msg h2 { font-size: 34px; color: #ffd700; text-shadow: 0 0 18px #ffd700; margin-bottom: 12px; }
  #msg p { font-size: 15px; max-width: 480px; line-height: 1.6; color: #e8e8ff; }
  #help { font-size: 12px; color: #aaa; margin-top: 6px; }
  .keys { color: #ffd700; font-weight: bold; }
</style>
</head>
<body>
<h1>✨ ANGE — L'ÉLU DES CIEUX ✨</h1>
<div style="position:relative">
  <canvas id="game" width="880" height="520"></canvas>
  <div id="hud"></div>
  <div id="msg"></div>
</div>
<p id="help"><span class="keys">←→</span> bouger · <span class="keys">Espace/↑</span> sauter (double saut) · <span class="keys">X</span> attaque de lumière · <span class="keys">C</span> bouclier · <span class="keys">R</span> recommencer</p>

<script>
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const hud = document.getElementById('hud'), msg = document.getElementById('msg');

// ---------- État ----------
let keys = {}, state = 'menu', frame = 0;
let score = 0, lives = 3, level = 1;

// ---------- Ange (joueur) ----------
const ange = { x: 80, y: H-140, w: 26, h: 34, vx: 0, vy: 0, onGround: false, jumps: 0, facing: 1, hp: 5, shield: 60, shieldMax: 60, inv: 0, atk: 0, glow: 0 };

// ---------- Niveaux ----------
let platforms, demons, feathers, portals, boss;
function makeLevel(n) {
  platforms = [{x:-50,y:H-60,w:W+100,h:80}];
  demons = []; feathers = []; portals = [];
  const diff = n - 1;
  // plateformes flottantes
  const spots = [[220,H-150],[380,H-220],[540,H-160],[690,H-240],[160,H-300],[420,H-340],[620,H-340],[790,H-160]];
  spots.forEach((s,i)=>{ if ((i+diff)%3!==2) platforms.push({x:s[0],y:s[1],w:110,h:14}); });
  // plumes (collectibles)
  spots.forEach((s,i)=>{ if ((i*7+diff)%4!==3) feathers.push({x:s[0]+55,y:s[1]-28,got:false,ph:i}); });
  // démons
  for (let i=0;i<3+diff;i++) demons.push({x:180+i*(620/(2+diff)),y:H-100,w:28,h:30,vx:(1+diff*0.4)*(i%2?1:-1),hp:2,ph:i*2,type:i%3});
  // portail de fin
  portals = [{x:W-60,y:H-140,w:36,h:80}];
  boss = null;
}

// ---------- Particules ----------
let parts = [];
function boom(x,y,color,n=14){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:30+Math.random()*20,c:color}); }

// ---------- Boss ----------
function makeBoss(){
  boss = { x: W-180, y: 120, w: 70, h: 70, hp: 12 + level*3, vx: 3, vy: 0, t: 0, atkT: 0 };
  demons = []; feathers = []; portals = [];
  platforms = [{x:-50,y:H-60,w:W+100,h:80},{x:80,y:H-200,w:130,h:14},{x:W-210,y:H-200,w:130,h:14}];
}
let bossShots = [];

// ---------- Input ----------
addEventListener('keydown', e=>{
  keys[e.key]=true;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if(e.key==='r'||e.key==='R'){ if(state!=='menu'){ restart(); } }
  if((e.key===' '||e.key==='ArrowUp')&&state==='menu'){ start(); }
  if((e.key===' '||e.key==='ArrowUp')&&state==='win'){ level++; start(); }
});
addEventListener('keyup', e=>keys[e.key]=false);

function restart(){ lives=3; score=0; level=1; start(); }
function start(){
  Object.assign(ange,{x:80,y:H-140,vx:0,vy:0,jumps:0,hp:5,shield:60,inv:0,atk:0});
  parts=[]; bossShots=[];
  if((level-1)%3===2) makeBoss(); else makeLevel(level);
  state='play'; msg.innerHTML='';
}

// ---------- Collision ----------
function hit(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }

// ---------- Update ----------
function update(){
  frame++;
  if(state!=='play') return;
  const a = ange;

  // Déplacement
  const sp = 4.5;
  a.vx = 0;
  if(keys['ArrowLeft']){ a.vx=-sp; a.facing=-1; }
  if(keys['ArrowRight']){ a.vx=sp; a.facing=1; }
  if((keys[' ']||keys['ArrowUp']) && a.jumps<2){
    if(!keys['_jumpHeld']){ a.vy=-11.5; a.jumps++; a.onGround=false; boom(a.x+13,a.y+a.h,'#fff8cc',8); }
    keys['_jumpHeld']=true;
  }
  if(!(keys[' ']||keys['ArrowUp'])) keys['_jumpHeld']=false;

  a.vy = Math.min(a.vy+0.55, 14);

  // Attaque
  if((keys['x']||keys['X']) && a.atk<=0){ a.atk=14; boom(a.x+a.facing*30+13,a.y+14,'#ffe9a0',10); }
  if(a.atk>0) a.atk--;
  if(a.shield<60 && frame%10===0) a.shield++;
  a.inv = Math.max(0,a.inv-1);
  a.glow = Math.max(0,a.glow-1);

  // Physique + plateformes
  a.x += a.vx; a.y += a.vy;
  a.x = Math.max(0, Math.min(W-a.w, a.x));
  a.onGround = false;
  for(const p of platforms){
    if(a.vy>=0 && a.x+a.w>p.x && a.x<p.x+p.w && a.y+a.h>=p.y && a.y+a.h<=p.y+p.h+a.vy){
      a.y=p.y-a.h; a.vy=0; a.onGround=true; a.jumps=0;
    }
  }
  if(a.y>H+40){ hurt(2); a.x=80; a.y=H-140; a.vy=0; }

  // Attaque touche démons
  if(a.atk>6){
    const atkBox = {x:a.x+(a.facing>0?a.w:-40), y:a.y, w:40, h:a.h};
    for(const d of demons){ if(hit(atkBox,d)&&d.hp>0){ d.hp--; a.atk=6; boom(d.x+14,d.y+14,'#ff9a55',8); if(d.hp<=0){ score+=100; boom(d.x+14,d.y+14,'#ff5544',22);} } }
    if(boss && hit(atkBox,boss)){ boss.hp--; a.atk=6; a.glow=6; boom(boss.x+35,boss.y+35,'#ffb060',10); }
  }

  // Démons
  if(demons.length){
    for(const d of demons){
      d.x+=d.vx;
      const range = 100+d.ph*40;
      if(d.x<80||d.x>W-110) d.vx*=-1;
      if(d.type===2) d.y = H-100+Math.sin(frame/20+d.ph)*30; // volant
      if(a.inv<=0 && hit(a,d)){
        hurt(1); a.vx=0; a.x += (a.x<d.x?-40:40);
      }
    }
  }

  // Plumes
  for(const f of feathers){
    if(!f.got && Math.abs(f.x-(a.x+13))<24 && Math.abs(f.y-(a.y+17))<28){
      f.got=true; score+=50; a.shield=Math.min(a.shieldMax,a.shield+15); boom(f.x,f.y,'#fff',12);
    }
  }

  // Portail
  for(const p of portals){
    if(hit(a,p)){
      score += 500 + lives*100;
      level++;
      if((level-1)%3===2) { msg.innerHTML='<h2>⚔️ Niveau '+level+' : BOSS ⚔️</h2><p>Le SEIGNEUR DES TÉNÈBRES approche…<br>Esquive ses projectiles et frappe-le avec <b>X</b> !</p>'; state='inter'; setTimeout(start,2200); }
      else { msg.innerHTML='<h2>✨ Niveau '+level+' ✨</h2><p>Ramène les plumes, purifie les démons, atteins le portail doré !</p>'; state='inter'; setTimeout(start,1800); }
    }
  }

  // Boss
  if(boss){
    boss.t++;
    boss.x += boss.vx;
    if(boss.x<100||boss.x>W-170) boss.vx*=-1;
    boss.y = 110 + Math.sin(boss.t/40)*50;
    boss.atkT++;
    if(boss.atkT>Math.max(40,90-level*8)){
      boss.atkT=0;
      const dx=(a.x-boss.x)/30, dy=(a.y-boss.y)/30;
      bossShots.push({x:boss.x+35,y:boss.y+35,vx:dx,vy:dy,r:8});
    }
    for(const s of bossShots){
      s.x+=s.vx; s.y+=s.vy;
      if(a.inv<=0 && Math.abs(s.x-(a.x+13))<20 && Math.abs(s.y-(a.y+17))<24){ hurt(1); s.dead=true; }
      if(s.x<-20||s.x>W+20||s.y<-20||s.y>H+20) s.dead=true;
    }
    bossShots = bossShots.filter(s=>!s.dead);
    if(boss.hp<=0){
      boom(boss.x+35,boss.y+35,'#ffd700',40); boom(boss.x+35,boss.y+35,'#ff5544',30);
      score += 1000;
      state='win';
      msg.innerHTML='<h2>👑 VICTOIRE ! 👑</h2><p>Le seigneur des ténèbres est purifié !<br>Score : <b>'+score+'</b> — Appuie sur <b>Espace</b> pour le niveau '+(level+1)+' (plus dur !)</p>';
      boss=null;
    }
  }

  // Particules
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.life--; }
  parts = parts.filter(p=>p.life>0);
}

function hurt(dmg){
  if(ange.shield>=20 && (keys['c']||keys['C'])){ ange.shield-=20; ange.inv=20; boom(ange.x+13,ange.y+17,'#7ec8ff',16); return; }
  ange.hp-=dmg; ange.inv=60;
  boom(ange.x+13,ange.y+17,'#ff5566',16);
  if(ange.hp<=0){
    lives--; ange.hp=5;
    if(lives<=0){
      state='over';
      msg.innerHTML='<h2>💫 Les ténèbres l&apos;emportent… 💫</h2><p>L&apos;ange est tombé au niveau '+level+' — Score : <b>'+score+'</b><br>Appuie sur <b>R</b> pour renaître</p>';
    } else { Object.assign(ange,{x:80,y:H-140,vy:0,vx:0}); }
  }
}
function makeBossStart(){
  msg.innerHTML='<h2>⚔️ BOSS ⚔️</h2><p>SEIGNEUR DES TÉNÈBRES — '+(boss?boss.hp:0)+' PV<br>Frappe-le avec <b>X</b> quand il passe à portée !</p>';
  state='inter'; setTimeout(()=>{ msg.innerHTML=''; state='play'; },2000);
}

// ---------- Rendu ----------
function draw(){
  // Ciel
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141432'); g.addColorStop(0.6,'#2a1e4e'); g.addColorStop(1,'#4e2a5e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // Étoiles
  ctx.fillStyle='#fff';
  for(let i=0;i<40;i++){ const x=(i*127)%W, y=(i*61)%(H-100); ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(frame/40+i)); ctx.fillRect(x,y,2,2); }
  ctx.globalAlpha=1;

  if(state==='menu'){
    msg.innerHTML='<h2>✨ ANGE ✨</h2><p>Tu es l\'ange gardien des Cieux. Traverse les royaumes corrompus,<br>purifie les démons, récupère les <b>plumes sacrées</b> et atteins le <b>portail doré</b>.<br>Chaque 3ᵉ niveau : un <b>BOSS</b> !<br><br><b>Appuie sur ESPACE pour commencer</b></p>';
    drawAngel(W/2-13, H/2+70);
    return;
  }

  // Plateformes
  for(const p of platforms){
    ctx.fillStyle='#5e4a8e'; ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle='#8e7ec8'; ctx.fillRect(p.x,p.y,p.w,3);
  }

  // Plumes
  for(const f of feathers){ if(!f.got) drawFeather(f.x, f.y + Math.sin(frame/15+f.ph)*5); }

  // Portail
  for(const p of portals){
    ctx.save(); ctx.translate(p.x+p.w/2, p.y+p.h/2);
    for(let i=0;i<3;i++){ ctx.strokeStyle=['#ffd700','#ffec80','#fff8cc'][i]; ctx.lineWidth=3;
      ctx.beginPath(); ctx.ellipse(0,0,14+i*4+p.w/2-14,(p.h/2)+Math.sin(frame/10+i)*3,0,0,Math.PI*2); ctx.stroke(); }
    ctx.restore();
  }

  // Démons
  for(const d of demons) drawDemon(d);

  // Boss
  if(boss) drawBoss();

  // Projectiles boss
  ctx.fillStyle='#ff6a3a'; ctx.shadowColor='#ff6a3a'; ctx.shadowBlur=12;
  for(const s of bossShots){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
  ctx.shadowBlur=0;

  // Ange
  if(state!=='over') drawAngel(ange.x, ange.y);

  // Attaque
  if(ange.atk>6){
    ctx.fillStyle='rgba(255,235,160,0.8)'; ctx.shadowColor='#ffe9a0'; ctx.shadowBlur=18;
    const dirx = ange.x+(ange.facing>0?ange.w:-46);
    ctx.beginPath(); ctx.arc(dirx+23, ange.y+17, 26, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  }

  // Particules
  for(const p of parts){ ctx.globalAlpha=p.life/50; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,3,3); }
  ctx.globalAlpha=1;

  // HUD
  hud.innerHTML = '❤️ '+ '♦'.repeat(Math.max(0,ange.hp)) +'<br>🛡️ '+'▮'.repeat(Math.round(ange.shield/10))+'<br>🪶 '+score+' pts — Niveau '+level+' — Vies '+lives;
}

function drawAngel(x,y){
  ctx.save(); ctx.translate(x+13,y);
  // Halo
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=2.5; ctx.shadowColor='#ffd700'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.ellipse(0,4,9,3,0,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
  // Ailes (battement)
  const flap = Math.sin(frame/6)*8;
  ctx.fillStyle = ange.inv>0 && Math.floor(frame/4)%2 ? '#ff8899' : '#fff';
  ctx.beginPath(); ctx.moveTo(-2,12); ctx.quadraticCurveTo(-22,4-flap,-26,16-flap); ctx.quadraticCurveTo(-14,16,-2,18); ctx.fill();
  ctx.beginPath(); ctx.moveTo(2,12); ctx.quadraticCurveTo(22,4-flap,26,16-flap); ctx.quadraticCurveTo(14,16,2,18); ctx.fill();
  // Corps (toge)
  ctx.fillStyle = ange.inv>0 && Math.floor(frame/4)%2 ? '#ff8899' : '#f4f0ff';
  ctx.beginPath(); ctx.moveTo(-8,10); ctx.lineTo(8,10); ctx.lineTo(11,32); ctx.lineTo(-11,32); ctx.closePath(); ctx.fill();
  // Tête
  ctx.fillStyle='#ffe0c0'; ctx.beginPath(); ctx.arc(0,4,7,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawFeather(x,y){
  ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(frame/20)*0.3);
  ctx.fillStyle='#fff'; ctx.shadowColor='#ffd700'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.ellipse(0,0,4,11,0,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.restore();
}

function drawDemon(d){
  ctx.save(); ctx.translate(d.x+14,d.y+15);
  ctx.fillStyle='#8a1a2e'; ctx.shadowColor='#ff2a4a'; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.arc(0,0,12,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Cornes
  ctx.beginPath(); ctx.moveTo(-9,-8); ctx.lineTo(-14,-18); ctx.lineTo(-4,-11); ctx.fill();
  ctx.beginPath(); ctx.moveTo(9,-8); ctx.lineTo(14,-18); ctx.lineTo(4,-11); ctx.fill();
  // Yeux
  ctx.fillStyle='#ffd700'; ctx.fillRect(-6,-3,4,4); ctx.fillRect(2,-3,4,4);
  ctx.restore();
}

function drawBoss(){
  const b=boss;
  ctx.save(); ctx.translate(b.x+35,b.y+35);
  ctx.fillStyle='#4a1030'; ctx.shadowColor='#ff2a4a'; ctx.shadowBlur=25;
  ctx.beginPath(); ctx.arc(0,0,32,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
  // Cornes
  ctx.beginPath(); ctx.moveTo(-18,-22); ctx.lineTo(-30,-48); ctx.lineTo(-8,-26); ctx.fill();
  ctx.beginPath(); ctx.moveTo(18,-22); ctx.lineTo(30,-48); ctx.lineTo(8,-26); ctx.fill();
  // Yeux
  ctx.fillStyle='#ffdd00';
  ctx.beginPath(); ctx.arc(-11,-6,6,0,Math.PI*2); ctx.arc(11,-6,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#000'; ctx.fillRect(-13,-7,4,3); ctx.fillRect(9,-7,4,3);
  // Barre de vie
  ctx.fillStyle='#300'; ctx.fillRect(-40,-52,80,8);
  ctx.fillStyle='#f33'; ctx.fillRect(-40,-52,80*b.hp/(12+level*3),8);
  ctx.restore();
}

// ---------- Boucle ----------
makeLevel(1);
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
